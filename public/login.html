<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手机配对 · Codex 工作台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/mobile-ui.css"></head><body><main class="pairing-page"><h1>连接 Codex 工作台</h1><p>在 Mac 的工作台中打开“手机访问”，生成配对码。</p><form id="pair-form"><label for="pair-code">六位配对码</label><input id="pair-code" aria-describedby="pair-status" enterkeyhint="go" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="primary-button">配对并进入</button></form><p id="pair-status" role="status"></p><p>登录有效期由本机生成配对码时设置。请仅在自己的手机上配对。</p></main><script type="module" src="/login.js"></script></body></html>
