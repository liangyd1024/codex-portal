s"><link rel="stylesheet" href="/mobile-ui.css"></head><body><main class="pairing-page"><h1>连接 Codex 工作台</h1><p>首次访问时，在 Mac 工作台的“手机访问”中生成配对码。已配对设备将自动进入。</p><form id="pair-form" hidden><label for="pair-code">六位配对码</label><input id="pair-code" aria-describedby="pair-status" enterkeyhint="go" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="primary-button">配对并进入</button></form><p id="pair-status" role="status">正在检查已有登录…</p><button id="pair-retry" class="secondary-button" type="button" hidden>重新检查连接</button><p>重启或升级工作台不会清除手机登录。请使用原来的访问地址和浏览器；登录有效期由本机配对时设置。</p><p><a href="">重新加载页面</a></p><noscript>请启用 JavaScript 后重新加载页面。</noscript></main><script defer src="/login.js"></script></body></html>
