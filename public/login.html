<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" sizes="64x64" href="/icon-cp-64.png"><link rel="apple-touch-icon" sizes="180x180" href="/icon-cp-180.png"><title>手机配对 · Codex Portal</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/mobile-ui.css"><link rel="manifest" crossorigin="use-credentials" href="/manifest.webmanifest"></head><body><main class="pairing-page"><h1>连接 Codex Portal</h1><p>首次访问时，在 Mac 工作台的“手机访问”中生成配对码。已配对设备将自动进入。</p><form id="pair-form" hidden><label for="pair-code">六位配对码</label><input id="pair-code" aria-describedby="pair-status" enterkeyhint="go" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="primary-button">配对并进入</button></form><p id="pair-status" role="status">正在检查已有登录…</p><button id="pair-retry" class="secondary-button" type="button" hidden>重新检查连接</button><p>重启或升级工作台不会清除手机登录。请使用原来的访问地址和浏览器；登录有效期由本机配对时设置。</p><p><a href="">重新加载页面</a></p><noscript>请启用 JavaScript 后重新加载页面。</noscript></main><script defer src="/login.js"></script></body></html>
